<!DOCTYPE html>
<html lang="en">

<head>
  <title>OSM Buildings</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
  <link rel="stylesheet" href="osmbuildings.css">
  <script src="osmbuildings.js"></script>
</head>

<body>
  <div id="map"></div>
  <script>
    const osmb = new OSMBuildings({
      container: 'map',
      zoom: 16,
      minZoom: 16,
      maxZoom: 19,
      position: { latitude: 54.374705, longitude: 18.46673 },
      state: true, // stores map position/rotation in url
      attribution: '© 3D <a href="https://osmbuildings.org/copyright/">OSM Buildings</a> ' + ' / ' + 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });
    osmb.addMapTiles('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'),
      osmb.addGeoJSONTiles('https://{s}.data.osmbuildings.org/0.2/59fcc2e8/tile/{z}/{x}/{y}.json');
  </script>
</body>

</html>
